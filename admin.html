<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ticket maker (organizer)</title>
<link rel="stylesheet" href="style.css">
<style>
textarea,input[type=file]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:110px}
button,a.b{font:600 1rem Figtree,sans-serif;background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:10px 14px;text-decoration:none;display:inline-block;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
canvas{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
</style></head>
<body><main>
  <h1>Ticket maker</h1>
  <p class="mute">Organizer tool. Everything runs in your browser; no guest data is uploaded anywhere. Do not link to this page from the public site.</p>
  <p>1. In Paystack, export your transactions as CSV. 2. Upload it here (or paste it). 3. Download each ticket image and send it on WhatsApp.</p>
  <input type="file" id="file" accept=".csv,text/csv">
  <p class="mute small">or paste CSV:</p>
  <textarea id="paste" placeholder="Paste CSV here"></textarea>
  <p><button id="load">Make tickets</button> <button id="all" hidden>Download all</button></p>
  <p id="info" class="mute"></p>
  <div id="out"></div>
</main>
<script src="config.js"></script>
<script>
const E = window.EVENT, $ = id => document.getElementById(id);
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
  else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}
  else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))rows.push(r);r=[]}
  else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}

const COLS={name:["customer name","name"],phone:["whatsapp","phone","mobile"],ref:["reference"],amount:["amount"],status:["status"],ticket:["ticket","plan","type"]};
function find(h,words){for(const w of words){const i=h.findIndex(x=>x.toLowerCase().includes(w));if(i>-1)return i}return -1}
function waNumber(p){let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="233"+d.slice(1);return d}
function typeFor(row,idx){if(idx.ticket>-1&&row[idx.ticket])return row[idx.ticket];
  const a=parseFloat(String(row[idx.amount]||"").replace(/[^\d.]/g,""));
  const t=E.tickets.find(t=>t.price===a);return t?t.name:"Ticket"}
function draw(cv,g){const W=1200,H=480,x=cv.getContext("2d");cv.width=W;cv.height=H;
  x.fillStyle="#12302a";x.fillRect(0,0,W,H);
  x.fillStyle="#a97a2c";x.fillRect(0,0,24,H);
  x.fillStyle="#fbfcfb";x.textBaseline="alphabetic";
  x.font="64px Georgia,serif";x.fillText(E.name,70,115);
  x.font="34px Arial,sans-serif";x.fillStyle="#d9a955";x.fillText(E.date,70,170);
  x.fillStyle="#fbfcfb";x.fillText(E.venue,70,215);
  x.font="bold 54px Arial,sans-serif";x.fillText(g.name,70,320);
  x.font="34px Arial,sans-serif";x.fillStyle="#d9a955";x.fillText(g.type+(g.qty>1?"  x"+g.qty:""),70,375);
  x.fillStyle="#fbfcfb";x.fillRect(870,0,3,H);
  x.setLineDash([12,12]);x.strokeStyle="#a97a2c";x.lineWidth=3;x.beginPath();x.moveTo(870,0);x.lineTo(870,H);x.stroke();x.setLineDash([]);
  x.save();x.translate(1050,H/2);x.rotate(-Math.PI/2);x.textAlign="center";
  x.fillStyle="#fbfcfb";x.font="bold 80px monospace";x.fillText(g.code,0,25);x.restore();
  x.font="26px Arial,sans-serif";x.fillStyle="#9db3ac";x.fillText("Show this ticket at the door",70,440)}
const made=[];
function build(text){
  const rows=parseCSV(text);if(rows.length<2){$("info").textContent="No rows found.";return}
  const h=rows[0],idx={};for(const k in COLS)idx[k]=find(h,COLS[k]);
  if(idx.name<0||idx.ref<0){$("info").textContent="Could not find name/reference columns. Edit COLS in admin.html.";return}
  $("out").innerHTML="";made.length=0;let n=0,skip=0;
  rows.slice(1).forEach(r=>{
    if(idx.status>-1&&r[idx.status]&&!/success/i.test(r[idx.status])){skip++;return}
    const ref=(r[idx.ref]||"").trim();if(!ref)return;
    const g={name:(r[idx.name]||"Guest").trim(),type:typeFor(r,idx),qty:1,code:ref.replace(/[^a-z0-9]/gi,"").slice(-6).toUpperCase(),phone:waNumber(r[idx.phone])};
    const card=document.createElement("div");card.className="card";
    const cv=document.createElement("canvas");draw(cv,g);card.appendChild(cv);
    const acts=document.createElement("div");acts.className="acts";
    const d=document.createElement("button");d.textContent="Download image";
    const dl=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ticket-"+g.name.replace(/\W+/g,"-")+"-"+g.code+".png";a.click()});
    d.onclick=dl;acts.appendChild(d);
    const w=document.createElement("a");w.className="b";w.target="_blank";w.rel="noopener";
    w.textContent=g.phone?"Open WhatsApp":"No phone number";
    if(g.phone)w.href="https://wa.me/"+g.phone+"?text="+encodeURIComponent("Hi "+g.name+", here is your ticket for "+E.name+". Your code is "+g.code+". Show the attached image at the door. See you there!");
    acts.appendChild(w);card.appendChild(acts);$("out").appendChild(card);made.push(dl);n++});
  $("info").textContent=n+" ticket(s) made"+(skip?", "+skip+" skipped (not successful)":"")+". Tip: download the image first, then tap Open WhatsApp and attach it.";
  $("all").hidden=!n}
$("load").onclick=()=>{const f=$("file").files[0];if(f){f.text().then(build)}else build($("paste").value)};
$("all").onclick=()=>made.forEach((f,i)=>setTimeout(f,i*600));
</script></body></html>
